<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record Live</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
  }
  #canvas-container {
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }
  #title {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7);
    pointer-events: none;
    z-index: 10;
  }
  #hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    z-index: 10;
  }
  /* 输入面板样式 */
  #input-panel {
    position: fixed;
    top: 100px;
    right: 20px;
    background: rgba(20, 25, 40, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(100, 150, 255, 0.2);
    border-radius: 12px;
    padding: 20px;
    width: 280px;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }
  .input-group {
    margin-bottom: 16px;
  }
  .input-group label {
    display: block;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .input-group input {
    width: 100%;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(100, 150, 255, 0.3);
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
  }
  .input-group input:focus {
    border-color: rgba(100, 150, 255, 0.6);
    background: rgba(255, 255, 255, 0.12);
  }
  .input-group input::placeholder {
    color: rgba(255, 255, 255, 0.35);
  }
  #search-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #4488ff, #2266dd);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 2px;
  }
  #search-btn:hover {
    background: linear-gradient(135deg, #55aaff, #3377ee);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(68, 136, 255, 0.4);
  }
  #search-btn:active {
    transform: translateY(0);
  }
  #clear-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid rgba(255, 100, 100, 0.4);
    border-radius: 8px;
    color: rgba(255, 150, 150, 0.8);
    font-size: 13px;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.3s ease;
  }
  #clear-btn:hover {
    background: rgba(255, 100, 100, 0.15);
    border-color: rgba(255, 100, 100, 0.6);
  }
  /* 搜索建议下拉 */
  .suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: rgba(20, 25, 50, 0.95);
    border: 1px solid rgba(100, 150, 255, 0.3);
    border-top: none;
    border-radius: 0 0 8px 8px;
    max-height: 200px;
    overflow-y: auto;
    display: none;
    z-index: 200;
  }
  .suggestions.show {
    display: block;
  }
  .suggestion-item {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
  }
  .suggestion-item:hover {
    background: rgba(100, 150, 255, 0.2);
  }
  .suggestion-item.exact {
    color: #88bbff;
  }
  /* 输入框包装器 */
  .input-wrapper {
    position: relative;
  }
  /* 提示消息 */
  #message {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 25, 40, 0.9);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 100;
    pointer-events: none;
  }
  #message.show {
    opacity: 1;
  }
  #message.error {
    border: 1px solid rgba(255, 100, 100, 0.5);
    color: #ff8888;
  }
  #message.success {
    border: 1px solid rgba(100, 255, 150, 0.5);
    color: #88ffaa;
  }
  /* 标记点颜色 */
  .marker-origin { color: #44ff88; }
  .marker-dest { color: #ffaa44; }
  .marker-end { color: #ff4444; }
</style>
</head>
<body>
<div id="title">Record Live</div>
<div id="canvas-container"></div>
<div id="hint">拖动旋转 · 滚轮缩放</div>

<!-- 输入面板 -->
<div id="input-panel">
  <div class="input-group">
    <label>起点</label>
    <div class="input-wrapper">
      <input type="text" id="origin-input" placeholder="输入起点，如：北京">
    </div>
  </div>
  <div class="input-group">
    <label>途经点（可选）</label>
    <div class="input-wrapper">
      <input type="text" id="dest-input" placeholder="输入途经点，如：上海">
    </div>
  </div>
  <div class="input-group">
    <label>终点</label>
    <div class="input-wrapper">
      <input type="text" id="end-input" placeholder="输入终点，如：东京">
    </div>
  </div>
  <button id="search-btn">显示路线</button>
  <button id="clear-btn">清除路线</button>
</div>

<div id="message"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const API_BASE = 'http://localhost:5100/api';

// 坐标转球面位置
function latLngToVector3(lat, lng, radius) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lng + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

// 显示提示消息
function showMessage(text, type = 'info') {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = `show ${type}`;
  setTimeout(() => msg.classList.remove('show'), 3000);
}

// 场景设置
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 6;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// Earth
const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
const textureLoader = new THREE.TextureLoader();

const earthMaterial = new THREE.MeshPhongMaterial({
  color: 0x4488ff,
  emissive: 0x112244,
  specular: 0x333333,
  shininess: 15,
});
const earth = new THREE.Mesh(earthGeometry, earthMaterial);
scene.add(earth);

// Try loading earth texture
textureLoader.load(
  'https://unpkg.com/three-globe@2.31.1/example/img/earth-blue-marble.jpg',
  (texture) => {
    earthMaterial.map = texture;
    earthMaterial.color.set(0xffffff);
    earthMaterial.emissive.set(0x000000);
    earthMaterial.needsUpdate = true;
  },
  undefined,
  () => {
    addGridLines();
  }
);

function addGridLines() {
  const lineMaterial = new THREE.LineBasicMaterial({ color: 0x224488, transparent: true, opacity: 0.3 });
  for (let lat = -80; lat <= 80; lat += 20) {
    const phi = (90 - lat) * (Math.PI / 180);
    const points = [];
    for (let lon = 0; lon <= 360; lon += 2) {
      const theta = lon * (Math.PI / 180);
      const r = 1.002;
      points.push(new THREE.Vector3(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      ));
    }
    const geom = new THREE.BufferGeometry().setFromPoints(points);
    earth.add(new THREE.Line(geom, lineMaterial));
  }
  for (let lon = 0; lon < 360; lon += 20) {
    const theta = lon * (Math.PI / 180);
    const points = [];
    for (let lat = -90; lat <= 90; lat += 2) {
      const phi = (90 - lat) * (Math.PI / 180);
      const r = 1.002;
      points.push(new THREE.Vector3(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      ));
    }
    const geom = new THREE.BufferGeometry().setFromPoints(points);
    earth.add(new THREE.Line(geom, lineMaterial));
  }
}

// Atmosphere glow
const atmosphereGeometry = new THREE.SphereGeometry(1.12, 64, 64);
const atmosphereMaterial = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
      gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true,
});
const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
scene.add(atmosphere);

// Stars
const starsGeometry = new THREE.BufferGeometry();
const starsCount = 3000;
const starsPositions = new Float32Array(starsCount * 3);
for (let i = 0; i < starsCount * 3; i++) {
  starsPositions[i] = (Math.random() - 0.5) * 100;
}
starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, sizeAttenuation: true });
const stars = new THREE.Points(starsGeometry, starsMaterial);
scene.add(stars);

// Lights
const ambientLight = new THREE.AmbientLight(0x333355, 2);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
sunLight.position.set(5, 3, 5);
scene.add(sunLight);

// 路线相关对象
let routeGroup = new THREE.Group();
scene.add(routeGroup);
let markers = [];
let routeLine = null;

// 创建标记点
function createMarker(position, color, label) {
  const markerGroup = new THREE.Group();

  // 球体
  const sphereGeo = new THREE.SphereGeometry(0.025, 16, 16);
  const sphereMat = new THREE.MeshBasicMaterial({ color: color });
  const sphere = new THREE.Mesh(sphereGeo, sphereMat);
  markerGroup.add(sphere);

  // 光晕
  const glowGeo = new THREE.SphereGeometry(0.04, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: 0.4
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  markerGroup.add(glow);

  markerGroup.position.copy(position);
  markerGroup.userData.label = label;

  return markerGroup;
}

// 创建两点间的曲线
function createCurve(startPos, endPos, color) {
  const mid = new THREE.Vector3().addVectors(startPos, endPos).multiplyScalar(0.5);
  const length = startPos.distanceTo(endPos);
  // 向上弯曲
  mid.multiplyScalar(1.3);

  const curve = new THREE.QuadraticBezierCurve3(startPos, mid, endPos);
  const points = curve.getPoints(50);
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicMaterial({
    color: color,
    transparent: true,
    opacity: 0.8,
    linewidth: 2
  });
  return new THREE.Line(geometry, material);
}

// 清除路线
function clearRoute() {
  while (routeGroup.children.length > 0) {
    routeGroup.remove(routeGroup.children[0]);
  }
  markers = [];
  routeLine = null;
}

// 显示路线
function displayRoute(origin, dest, end) {
  clearRoute();

  const points = [];

  // 起点
  const originPos = latLngToVector3(origin.lat, origin.lng, 1.02);
  const originMarker = createMarker(originPos, 0x44ff88, origin.name);
  routeGroup.add(originMarker);
  markers.push(originMarker);
  points.push(originPos);

  // 途经点（如果有）
  if (dest) {
    const destPos = latLngToVector3(dest.lat, dest.lng, 1.02);
    const destMarker = createMarker(destPos, 0xffaa44, dest.name);
    routeGroup.add(destMarker);
    markers.push(destMarker);
    points.push(destPos);
  }

  // 终点
  const endPos = latLngToVector3(end.lat, end.lng, 1.02);
  const endMarker = createMarker(endPos, 0xff4444, end.name);
  routeGroup.add(endMarker);
  markers.push(endMarker);
  points.push(endPos);

  // 画线连接所有点
  if (points.length >= 2) {
    for (let i = 0; i < points.length - 1; i++) {
      const line = createCurve(points[i], points[i + 1], 0x4488ff);
      routeGroup.add(line);
    }
  }
}

// 搜索功能
async function searchCity(query) {
  if (!query.trim()) return [];
  try {
    const res = await fetch(`${API_BASE}/geocode?q=${encodeURIComponent(query)}`);
    const data = await res.json();
    if (data.error) return [];
    return data.results;
  } catch (e) {
    console.error('API请求失败:', e);
    return [];
  }
}

async function onSearchClick() {
  const originInput = document.getElementById('origin-input');
  const destInput = document.getElementById('dest-input');
  const endInput = document.getElementById('end-input');

  const originQuery = originInput.value.trim();
  const destQuery = destInput.value.trim();
  const endQuery = endInput.value.trim();

  if (!originQuery || !endQuery) {
    showMessage('请至少输入起点和终点', 'error');
    return;
  }

  // 搜索所有地点
  const [originResults, destResults, endResults] = await Promise.all([
    searchCity(originQuery),
    destQuery ? searchCity(destQuery) : [],
    searchCity(endQuery)
  ]);

  if (originResults.length === 0) {
    showMessage(`未找到起点: ${originQuery}`, 'error');
    return;
  }
  if (destQuery && destResults.length === 0) {
    showMessage(`未找到途经点: ${destQuery}`, 'error');
    return;
  }
  if (endResults.length === 0) {
    showMessage(`未找到终点: ${endQuery}`, 'error');
    return;
  }

  const origin = originResults[0];
  const dest = destQuery ? destResults[0] : null;
  const end = endResults[0];

  displayRoute(origin, dest, end);

  const destStr = dest ? ` → ${dest.name}` : '';
  showMessage(`${origin.name}${destStr} → ${end.name}`, 'success');
}

// 事件绑定
document.getElementById('search-btn').addEventListener('click', onSearchClick);
document.getElementById('clear-btn').addEventListener('click', () => {
  clearRoute();
  showMessage('已清除路线', 'success');
});

// 回车搜索
['origin-input', 'dest-input', 'end-input'].forEach(id => {
  document.getElementById(id).addEventListener('keypress', (e) => {
    if (e.key === 'Enter') onSearchClick();
  });
});

// Animation
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // 标记点呼吸效果
  const time = Date.now() * 0.002;
  markers.forEach((marker, i) => {
    const scale = 1 + Math.sin(time + i) * 0.15;
    marker.scale.setScalar(scale);
  });

  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Stop auto-rotate on interaction, resume after idle
let idleTimer;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  clearTimeout(idleTimer);
});
controls.addEventListener('end', () => {
  idleTimer = setTimeout(() => { controls.autoRotate = true; }, 3000);
});
</script>
</body>
</html>
